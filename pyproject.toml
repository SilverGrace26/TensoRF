[project]
name = "trf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SilverGrace26", email = "ayushsaraswat2615@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax[cuda13]>=0.11.0",
    "optax>=0.2.8",
    "pytest>=9.1.1",
]

[project.scripts]
trf = "trf:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
